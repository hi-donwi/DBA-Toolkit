name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: lint, vet, and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"; echo "$unformatted"; exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: unit tests
        run: go test ./...
      - name: build
        run: go build -o /tmp/dbakit ./cmd/dbakit && /tmp/dbakit version

  integration:
    name: integration tests against PostgreSQL ${{ matrix.pg }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        pg: ["16-alpine", "17-alpine"]
    env:
      POSTGRES_IMAGE: postgres:${{ matrix.pg }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: run integration tests
        run: make integration
      - name: stop PostgreSQL
        if: always()
        run: |
          docker compose -p dbakit-integration -f tests/integration/docker-compose.yml down
          docker compose -p dbakit-integration-replica -f tests/integration/docker-compose.replica.yml down
