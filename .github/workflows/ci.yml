name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: lint, vet, and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"; echo "$unformatted"; exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: unit tests
        run: go test ./...
      - name: build
        run: go build -o /tmp/dbakit ./cmd/dbakit && /tmp/dbakit version

  integration:
    name: integration tests against PostgreSQL
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: start PostgreSQL
        run: docker compose -f tests/integration/docker-compose.yml up -d --wait
      - name: run integration tests
        run: go test -tags integration ./tests/integration/ -v
      - name: stop PostgreSQL
        if: always()
        run: docker compose -f tests/integration/docker-compose.yml down