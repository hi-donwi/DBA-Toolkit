services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dbakit
      POSTGRES_PASSWORD: dbakit_pw
      POSTGRES_DB: dbakit
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbakit -d dbakit"]
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data